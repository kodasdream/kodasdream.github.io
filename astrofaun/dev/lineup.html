<!doctype html>
<html><head><meta charset="utf-8"><title>Beast lineup</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100%;height:100%}#info{position:fixed;left:8px;bottom:8px;color:#fff;font:11px monospace;text-shadow:0 1px 2px #000;max-width:98%}</style></head>
<body><canvas id="c"></canvas><div id="info"></div>
<script type="module">
import { THREE, initRenderer, envFor, makeLights } from '../src/render/renderer.js';
import { bakeSpace } from '../src/render/textures.js';
import { makeBeast, animateBeast } from '../src/render/beastMesh.js';
import { updateOutlineScale } from '../src/render/toon.js';
import { BIOMES } from '../src/data/planets.js';
import { SPECIES } from '../src/data/beasts.js';
// Studio lineup: beasts on a plain stage, front 3/4 view
const params = new URLSearchParams(location.search);
const ids = (params.get('ids') || '1,2,3').split(',').map(Number);
const canvas = document.getElementById('c');
const renderer = initRenderer(canvas, params.get('q') || 'medium');
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
const biome = BIOMES[params.get('biome') || 'home'];
scene.background = bakeSpace(biome.space, innerWidth, innerHeight, 3);
scene.environment = envFor('home', biome);
const lights = makeLights(scene, biome);
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardMaterial({ color: 0xe8c8a0, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const cols = +(params.get('cols') || Math.ceil(Math.sqrt(ids.length * 1.8)));
const gap = +(params.get('gap') || 1.7);
const rows = Math.ceil(ids.length / cols);
ids.forEach((id, i) => {
  const b = makeBeast(id, params.get('variant') === '1');
  const cx = i % cols, cz = Math.floor(i / cols);
  b.position.set((cx - (cols - 1) / 2) * gap, 0, (cz - (rows - 1) / 2) * gap * 1.1);
  scene.add(b);
});
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
const fr = +(params.get('fr') || (rows * gap * 0.75 + 1));
const aspect = innerWidth / innerHeight;
cam.left = -fr * aspect; cam.right = fr * aspect; cam.top = fr; cam.bottom = -fr; cam.updateProjectionMatrix();
cam.position.set(0, 22, 34); cam.lookAt(0, 0.4, 0);
lights.follow(new THREE.Vector3());
document.getElementById('info').textContent = ids.map((id) => id + ':' + SPECIES[id - 1].name + '(' + SPECIES[id - 1].types.join('/') + ')').join('  ');
const beasts = scene.children.filter((o) => o.userData.anim);
const clock = new THREE.Clock();
let frames = 0;
function loop() { if (params.get('anim') !== '1' && frames++ > 2) { window.__done = true; return; } const t = clock.getElapsedTime(); for (const b of beasts) animateBeast(b, t, 0.016, 'idle'); updateOutlineScale(cam, innerHeight); renderer.render(scene, cam); requestAnimationFrame(loop); }
loop();
</script></body></html>
